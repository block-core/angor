<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angor</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="/assets/img/favicon.png?v=hub" />
    <link rel="apple-touch-icon" href="/assets/img/favicon.png?v=hub" />
    <link href="Angor.Client.styles.css" rel="stylesheet" />
    <link href="/assets/css/dashboard.css" rel="stylesheet" />
    <link href="/assets/css/app.css" rel="stylesheet" />
    <link href="/assets/css/invest.css" rel="stylesheet" />
    <link href="/assets/css/hub-invest-controls.css" rel="stylesheet" />
    <script>
        // Apply the payment theme before the first frame and before WASM starts.
        if (/^\/invest(?:view)?\//i.test(location.pathname)) {
            document.documentElement.classList.add('hub-payment-page');
            document.documentElement.dataset.paymentTheme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
        }
    </script>
    <meta name="description" content="A P2P funding protocol built on Bitcoin and Nostr">
    <meta name="keywords" content="Angor, blockchain, crowdfunding, smart contracts, blockchain technology, bitcoin, nostr, decentralized applications, dApps, development, easy to use, secure">
    <meta name="author" content="Angor Team">
    <meta name="robots" content="index, follow">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Angor">
    <meta name="application-name" content="Angor">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/assets/img/favicon.png?v=hub">
    <meta name="msapplication-config" content="/manifest.json">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
 
</head>

<body>
    <div id="app">
        <div class="loader-wrapper">
            <div class="loader"></div>
            <div class="hub-boot-content" role="status" aria-live="polite">
                <div class="hub-loading-mark"><img src="/assets/img/app-icon.png" alt="" /><span class="hub-loading-ring"></span></div>
                <h1>Getting your payment ready</h1>
                <p>Loading Angor...</p>
            </div>
            <script>
                (function() {
                    const theme = localStorage.getItem('theme');
                    const loader = document.querySelector('.loader-wrapper');
                    if (theme === 'dark') {
                        document.body.classList.add('dark');
                        loader.style.backgroundColor = '#083b46';
                    }
                })();
            </script>
        </div>
    </div>
    <div id="blazor-error-ui">
        <div class="content-wrapper">
            <strong>An unhandled error has occurred</strong>
            <div class="actions">
                <a href="" class="reload">Reload</a>
                <a class="dismiss">✕</a>
            </div>
        </div>
    </div>
    <script type="module" src="service-crypto.js?v=1"></script>
    <script src="nostr-tools-methods.js?v=1" type="module"></script>
    <script src="/assets/js/appUpdate.js?v=1"></script>
    <script src="/assets/js/app.js?v=1"></script>
    <script src="/assets/js/hub-payment.js?v=1"></script>
    <script src="_framework/blazor.webassembly.js?v=1"></script>
</body>

</html>
